name: Desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: appimage
          - os: windows-latest
            bundle: nsis
          - os: macos-14
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            standalone-apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm --prefix standalone-apps/desktop ci
      - run: node tests/native_bluetooth.test.mjs
      - run: node tests/bluetooth_response.test.mjs
      - run: npm run sv-check
      - name: Build desktop application
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Rust tests
        run: cargo test --manifest-path standalone-apps/desktop/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: niimblue-${{ matrix.os }}
          path: standalone-apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
