name: Desktop builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build_args: --bundles appimage
          - os: windows-latest
            build_args: --bundles nsis
          - os: macos-14
            build_args: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            standalone-apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm --prefix standalone-apps/desktop ci
      - run: node tests/native_bluetooth.test.mjs
      - run: node tests/bluetooth_response.test.mjs
      - run: npm run sv-check
      - name: Check Windows runtime setup script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/standalone-apps/desktop/src-tauri/src/webview2_install.ps1",
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Build desktop application
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build -- ${{ matrix.build_args }}
      - name: Rust tests
        run: cargo test --manifest-path standalone-apps/desktop/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: niimblue-${{ matrix.os }}
          path: |
            standalone-apps/desktop/src-tauri/target/release/NiimBlue.exe
            standalone-apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            standalone-apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            standalone-apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
